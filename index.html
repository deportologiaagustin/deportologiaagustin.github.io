<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Agustín González de la Fuente · Medicina Deportiva & Rendimiento</title>
  <meta name="description" content="Medicina del deporte con criterio clínico. Evaluación integral, retorno al movimiento sin dolor, nutrición basada en evidencia y prescripción médica personalizada en Recoleta, Buenos Aires.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #0B0F17;
      --bg-surface: #121824;
      --bg-card: #182030;
      --bg-card-hover: #1E283C;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text-main: #F4F6F8;
      --text-muted: #9BA3AF;
      --text-faint: #6B7280;
      --accent-green: #10B981;
      --accent-green-soft: rgba(16, 185, 129, 0.12);
      --accent-green-border: rgba(16, 185, 129, 0.35);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Barra Superior Fija */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-brand {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-brand span {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-green);
      padding: 2px 8px;
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green-border);
      border-radius: 999px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-topbar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      background: var(--accent-green);
      color: #051A12;
      border: 1px solid var(--accent-green);
    }

    .btn-topbar:hover {
      background: #0ea372;
      transform: translateY(-1px);
    }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 70px;
      background-image: url('clinica deporte web 2.jpg');
      background-size: cover;
      background-position: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(11, 15, 23, 0.72) 0%, rgba(11, 15, 23, 0.94) 85%);
      z-index: 1;
    }

    .hero-container {
      position: relative;
      z-index: 2;
      max-width: 820px;
      text-align: center;
      margin: 0 auto;
    }

    .pill-urgencia {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-green);
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green-border);
      margin-bottom: 24px;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(36px, 5.2vw, 62px);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 22px;
    }

    .hero-title em {
      font-style: italic;
      color: #E2E8F0;
    }

    .hero-copy {
      font-size: clamp(16px, 1.8vw, 19px);
      line-height: 1.65;
      color: #D1D5DB;
      font-weight: 300;
      max-width: 680px;
      margin: 0 auto 36px;
    }

    .hero-ctas {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .btn-hero-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      background: var(--accent-green);
      color: #051A12;
      border: 1px solid var(--accent-green);
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.35);
    }

    .btn-hero-primary:hover {
      background: #0ea372;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(16, 185, 129, 0.45);
    }

    .btn-hero-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 500;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--line-strong);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .btn-hero-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .hero-specs {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .hero-spec-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-spec-item svg {
      color: var(--accent-green);
    }

    /* Contenedor General */
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Sección de Preguntas Clínicas / Problemas */
    .section-frustraciones {
      padding: 80px 0;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--line);
    }

    .section-header {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 52px;
    }

    .section-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent-green);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(28px, 3.4vw, 42px);
      line-height: 1.18;
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .section-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .grid-frustraciones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card-frustracion {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 26px 22px;
      transition: all 0.25s ease;
    }

    .card-frustracion:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
    }

    .icono-foco {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--accent-green-soft);
      border: 1px solid var(--accent-green-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
      margin-bottom: 18px;
    }

    .card-frustracion h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .card-frustracion p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Grilla de los 5 Pilares Médicos */
    .section-ejes {
      padding: 96px 0;
      background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-surface) 100%);
    }

    .grid-ejes {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 48px;
    }

    .eje-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px;
      display: grid;
      grid-template-columns: 80px 1fr 280px;
      gap: 32px;
      align-items: center;
      transition: all 0.3s ease;
    }
